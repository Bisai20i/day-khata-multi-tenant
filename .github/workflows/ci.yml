name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  php:
    name: PHP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, fileinfo, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite database file
        run: touch database/database.sqlite

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  # SQLite cannot show DECIMAL insert rounding or row locking, so the same
  # suite is run against a real MySQL 8 as well. It is advisory for now
  # (continue-on-error) so that a pre-existing MySQL-only failure does not
  # block a pull request, while still surfacing money and locking regressions.
  mysql:
    name: PHP Tests (MySQL 8, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Every test provisions a tenant database (131 tables), which is slow on
    # MySQL: one job ran past three hours, so the suite runs in 6 shards.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Blocking: production runs MySQL, and SQLite does not enforce FK column
    # types, 64-char index names or MySQL's FK index rules.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: day_khata_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # phpunit.xml declares its <env> entries without force="true", so these
    # real environment variables win and the suite runs on MySQL.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: day_khata_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, bcmath, intl, gd, fileinfo, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # One database per tenant (131 tables each) overflows MySQL 8's default
      # table caches and surfaces as error 1615 "Prepared statement needs to
      # be re-prepared". Production servers need the same tuning in my.cnf.
      - name: Raise MySQL table caches
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL table_definition_cache = 20000; SET GLOBAL table_open_cache = 20000;"

      - name: Run tests against MySQL
        run: vendor/bin/pest --shard=${{ matrix.shard }}/6

  javascript:
    name: JS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js

      - name: Build frontend assets
        run: npm run build
